[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    engine: Cold-formed steel engineering calculations, FSM buckling, and KDS DSM design tests
    ui: Web API routes, JSON schemas, and UI integration tests
    manual: Online help manual tree, static assets, bilingual verification, and formula tests
    slow: Computationally heavy, multi-sweep sanity tests (FSM wide sweeps, etc.)
    fast: Ultra-fast unit tests (completes in < 1 second)
    sanity: Numerical stability, bound checks, and divergence defense tests
    frontend: HTML/JS DOM integrity, static asset link checks, and class method analysis
