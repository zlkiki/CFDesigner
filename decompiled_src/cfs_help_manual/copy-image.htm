<h1>Copy Image</h1>

<p>The Copy Image command on the <a href="edit-menu.htm">Edit menu</a>
is available when the active window is either the <a href="section-window.htm">Section Window</a>
or <a href="analysis-window.htm">Analysis Window</a>. This will copy the current display image
to the clipboard, which may then be pasted into another application.</p>
